targets:
  $default:
    builders:
      drift_dev:
        options:
          # ISO-8601 text keeps milliseconds and the UTC marker, and maps
          # directly to Postgres timestamptz for sync.
          store_date_time_values_as_text: true
          databases:
            app_database: lib/core/database/database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
